<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>토익스피킹 말하기 연습</title>
<style>
:root{
  --bg:#ffffff; --fg:#3c3c3c; --mut:#777; --line:#e5e5e5; --card:#f7f7f7;
  --green:#58cc02; --green-d:#58a700; --blue:#1cb0f6; --red:#ff4b4b; --red-d:#ea2b2b; --yellow:#ffc800;
  --ok-bg:#d7ffb8; --bad-bg:#ffdfe0;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#131f24; --fg:#f1f7fb; --mut:#9aa8b0; --line:#37464f; --card:#1f2c33; --ok-bg:#203a14; --bad-bg:#40191b; }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--fg);
  font-family:"Nunito","Pretendard","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;
  font-weight:700;line-height:1.45}
button{font:inherit;color:inherit;cursor:pointer}
#app{max-width:560px;margin:0 auto;min-height:100vh;min-height:100dvh;position:relative}

/* 홈 */
.top{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;gap:14px;align-items:center;
  padding:calc(12px + env(safe-area-inset-top,0px)) 16px 12px;border-bottom:2px solid var(--line)}
.stat{font-size:17px;font-weight:800}
.tog{margin-left:auto;font-size:14px;color:var(--mut);display:flex;gap:6px;align-items:center;cursor:pointer}
.tog input{width:18px;height:18px;accent-color:var(--green)}
.warn{margin:14px 16px 0;padding:12px 14px;border-radius:14px;background:#fff4cc;color:#6b5400;font-size:14px}
.unit{padding:20px 16px 8px}
.banner{border-radius:18px;padding:16px 18px;color:#fff;display:flex;justify-content:space-between;align-items:center;
  box-shadow:0 4px 0 rgba(0,0,0,.18)}
.banner .sub{font-size:13px;opacity:.9}
.banner .ttl{font-size:20px;font-weight:900}
.banner .ic{font-size:34px}
.path{display:flex;flex-direction:column;align-items:center;gap:16px;padding:22px 0 8px}
.node{width:72px;height:66px;border-radius:50%;border:0;background:var(--c);color:#fff;font-size:26px;font-weight:900;
  box-shadow:0 7px 0 rgba(0,0,0,.22);position:relative}
.node:active{transform:translateY(5px);box-shadow:0 2px 0 rgba(0,0,0,.22)}
.node.done{background:var(--yellow);color:#fff}
.node .st{position:absolute;bottom:-17px;left:50%;transform:translateX(-50%);font-size:12px;color:var(--yellow);
  white-space:nowrap;text-shadow:0 1px 0 rgba(0,0,0,.25)}
.foot-note{text-align:center;padding:28px 16px calc(40px + env(safe-area-inset-bottom,0px));color:var(--mut);font-size:13px}
.foot-note button{background:none;border:0;color:var(--mut);text-decoration:underline;font-size:13px}

/* 레슨 */
.lh{display:flex;align-items:center;gap:14px;padding:calc(14px + env(safe-area-inset-top,0px)) 16px 8px}
.x{background:none;border:0;font-size:24px;color:var(--mut);padding:2px 6px}
.bar{flex:1;height:16px;background:var(--line);border-radius:10px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--green);border-radius:10px;transition:width .35s;position:relative}
.bar i::after{content:"";position:absolute;left:8px;right:8px;top:4px;height:4px;background:rgba(255,255,255,.35);border-radius:4px}
.hearts{font-size:17px;font-weight:900;color:var(--red)}
.card{padding:14px 20px 210px}
.prompt{font-size:22px;font-weight:900;margin:8px 0 14px}
.topicq{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:10px 14px;font-size:14px;color:var(--mut);margin-bottom:14px}
.bubble{display:flex;align-items:center;gap:12px;border:2px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:14px;font-size:18px}
.spk{width:44px;height:44px;border-radius:12px;border:0;background:var(--blue);color:#fff;font-size:20px;flex:none;
  box-shadow:0 4px 0 #1899d6}
.spk:active{transform:translateY(3px);box-shadow:0 1px 0 #1899d6}
.chip{display:inline-block;background:var(--card);border:2px solid var(--line);border-radius:10px;padding:2px 10px;font-size:13px;color:var(--mut);margin-bottom:8px}
.ko{font-size:21px;font-weight:800;margin:4px 0 12px}
.en{font-size:19px;font-weight:800;min-height:34px}
.en .row{display:flex;gap:10px;align-items:flex-start}
.en .row .spk{width:38px;height:38px;font-size:17px}
.w-ok{color:var(--green-d)}
.w-no{color:var(--red-d);text-decoration:underline wavy;text-underline-offset:4px}
.hint{background:none;border:2px dashed var(--line);border-radius:12px;padding:8px 14px;color:var(--mut);font-size:15px}
.mic{display:flex;flex-direction:column;align-items:center;gap:10px;margin:26px 0 8px}
.micbtn{width:84px;height:84px;border-radius:50%;border:0;background:var(--blue);color:#fff;font-size:34px;
  box-shadow:0 6px 0 #1899d6}
.micbtn:active{transform:translateY(4px);box-shadow:0 2px 0 #1899d6}
.micbtn.on{background:var(--red);box-shadow:0 6px 0 var(--red-d);animation:pulse 1.1s infinite}
@keyframes pulse{0%{outline:0 solid rgba(255,75,75,.45)}70%{outline:18px solid rgba(255,75,75,0)}100%{outline:0 solid rgba(255,75,75,0)}}
@media (prefers-reduced-motion: reduce){.micbtn.on{animation:none}.bar i{transition:none}}
.micmsg{font-size:14px;color:var(--mut);text-align:center;min-height:20px}
.link{background:none;border:0;color:var(--blue);font-size:14px;text-decoration:underline;padding:4px}
.say{width:100%;border:2px solid var(--line);border-radius:14px;background:var(--card);padding:12px 14px;min-height:64px;font-size:17px;font-weight:700}
.say small{display:block;color:var(--mut);font-size:12px;margin-bottom:2px}
textarea.say{resize:vertical;color:var(--fg);font-family:inherit}
.errmsg{color:var(--red-d);font-size:14px;text-align:center}

.foot{position:fixed;left:0;right:0;bottom:0;border-top:2px solid var(--line);background:var(--bg);
  padding:14px 16px calc(16px + env(safe-area-inset-bottom,0px))}
.foot .in{max-width:560px;margin:0 auto}
.foot.ok{background:var(--ok-bg);border-color:transparent}
.foot.bad{background:var(--bad-bg);border-color:transparent}
.fb{font-size:20px;font-weight:900;margin-bottom:10px}
.foot.ok .fb{color:var(--green-d)}
.foot.bad .fb{color:var(--red-d)}
.fb small{display:block;font-size:14px;font-weight:700;opacity:.9}
.btn{width:100%;border:0;border-radius:16px;padding:14px;font-size:17px;font-weight:900;color:#fff;background:var(--green);
  box-shadow:0 5px 0 var(--green-d)}
.btn:active:not(:disabled){transform:translateY(4px);box-shadow:0 1px 0 var(--green-d)}
.btn:disabled{background:var(--line);color:var(--mut);box-shadow:0 5px 0 rgba(0,0,0,.08);cursor:not-allowed}
.btn.red{background:var(--red);box-shadow:0 5px 0 var(--red-d)}
.btn.ghost{background:none;color:var(--blue);box-shadow:none;border:2px solid var(--line)}
.skip{margin-top:10px;width:100%;background:none;border:2px solid var(--line);border-radius:16px;padding:11px;
  font-size:15px;color:var(--mut)}

/* 결과 */
.res{text-align:center;padding:90px 24px 40px}
.res .big{font-size:76px}
.res h1{font-size:28px;margin:10px 0 4px}
.res .stars{font-size:38px;letter-spacing:6px;color:var(--yellow);margin:8px 0 22px}
.tiles{display:flex;gap:12px;justify-content:center;margin:0 0 30px}
.tile{flex:1;max-width:150px;border:2px solid var(--line);border-radius:16px;overflow:hidden}
.tile .h{padding:5px;font-size:12px;color:#fff;font-weight:900}
.tile .b{padding:14px 6px;font-size:22px;font-weight:900}
.res .btn{max-width:360px}

.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center;z-index:50}
.mbox{width:100%;max-width:560px;background:var(--bg);border-radius:22px 22px 0 0;padding:26px 20px calc(22px + env(safe-area-inset-bottom,0px));
  display:grid;gap:12px;text-align:center}
.mbox p{margin:0 0 6px;font-size:19px;font-weight:900}
.x{min-width:44px;min-height:44px;font-size:26px}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
</style>
</head>

/* 레슨 쪼개기: 한 레슨 7문장 이하로 균등 분할, 파트 5는 마지막에 '전체 말하기' 레슨 추가 */
var LESSONS = {};
function lessonsOf(u){
  if(u._ls) return u._ls;
  var n = Math.ceil(u.cards.length / 7), size = Math.ceil(u.cards.length / n), out = [];
  for(var i=0;i<n;i++){
    var id = u.id + '-' + i;
    out.push({id:id, unit:u, cards:u.cards.slice(i*size,(i+1)*size), question:u.question});
  }
  if(u.part === 5){
    var all = u.cards.map(function(c){return c.en;}).join(' ');
    out.push({id:u.id+'-full', unit:u, full:true, question:u.question,
      cards:[{type:'full', en:all, ko:'주장 → 이유 1 → 이유 2 → 결론 순서로 이어서 말해 보세요.'}]});
  }
  out.forEach(function(l){ LESSONS[l.id] = l; });
  u._ls = out; return out;
}
U.forEach(lessonsOf);

var KEY = 'tos-speaking-v1';

try { var s0 = JSON.parse(localStorage.getItem(KEY) || '{}'); for(var k in s0) save[k] = s0[k]; } catch(e){}
function persist(){ try{ localStorage.setItem(KEY, JSON.stringify(save)); }catch(e){} }
function today(){ var d=new Date(); return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate(); }
function yesterday(){ var d=new Date(); d.setDate(d.getDate()-1); return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate(); }

/* ───────── 텍스트 정규화 · 채점 ───────── */
var ONES = ['zero','one','two','three','four','five','six','seven','eight','nine','ten','eleven','twelve','thirteen','fourteen','fifteen','sixteen','seventeen','eighteen','nineteen'];
var TENS = ['','','twenty','thirty','forty','fifty','sixty','seventy','eighty','ninety'];
var ORD = {one:'first', two:'second', three:'third', five:'fifth', eight:'eighth', nine:'ninth', twelve:'twelfth'};
function numW(n){ if(n<20) return ONES[n]; if(n<100) return TENS[Math.floor(n/10)] + (n%10 ? ' '+ONES[n%10] : ''); return String(n); }
function ordW(n){ var w = numW(n).split(' '), l = w.pop(); l = ORD[l] || (/y$/.test(l) ? l.slice(0,-1)+'ieth' : l+'th'); w.push(l); return w.join(' '); }
function norm(s){
  s = String(s).toLowerCase().replace(/[’‘`´]/g, "'");
  s = s.replace(/\b([ap])\.m\.?/g, '$1m');
  s = s.replace(/\b(\d{1,2}):(\d{2})\b/g, function(m,h,mm){ return mm==='00' ? h : h+' '+mm; });
  s = s.replace(/\b(\d+)(st|nd|rd|th)\b/g, function(m,n){ return ' '+ordW(+n)+' '; });
  s = s.replace(/\b\d+\b/g, function(m){ return ' '+numW(+m)+' '; });
  s = s.replace(/\bcannot\b/g,'can not').replace(/\bwon't\b/g,'will not').replace(/\bcan't\b/g,'can not')
       .replace(/n't\b/g,' not').replace(/'re\b/g,' are').replace(/'m\b/g,' am').replace(/'ve\b/g,' have')
       .replace(/'ll\b/g,' will').replace(/'d\b/g,' would').replace(/'s\b/g,' is');
  s = s.replace(/[^a-z\s]/g,' ');
  return s.replace(/\s+/g,' ').trim();
}
function words(s){ var n = norm(s); return n ? n.split(' ') : []; }
function lev(a,b){
  var m=a.length,n=b.length,d=[],i,j;
  for(i=0;i<=m;i++){ d[i]=[i]; }
  for(j=1;j<=n;j++){ d[0][j]=j; }
  for(i=1;i<=m;i++) for(j=1;j<=n;j++)
    d[i][j]=Math.min(d[i-1][j]+1, d[i][j-1]+1, d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));
  return d[m][n];
}
function eq(a,b){ return a===b || (a.length>=5 && b.length>=5 && (lev(a,b)<=1 || a.indexOf(b)===0 || b.indexOf(a)===0)); }
function lcs(a,b){
  var n=a.length,m=b.length,d=[],i,j;
  for(i=0;i<=n;i++){ d[i]=[]; for(j=0;j<=m;j++) d[i][j]=0; }
  for(i=1;i<=n;i++) for(j=1;j<=m;j++)
    d[i][j] = eq(a[i-1],b[j-1]) ? d[i-1][j-1]+1 : Math.max(d[i-1][j], d[i][j-1]);
  var res=[]; for(i=0;i<n;i++) res.push(false);
  i=n; j=m;
  while(i>0 && j>0){
    if(eq(a[i-1],b[j-1]) && d[i][j]===d[i-1][j-1]+1){ res[i-1]=true; i--; j--; }
    else if(d[i-1][j]>=d[i][j-1]) i--; else j--;
  }
  return res;
}
function evaluate(target, spoken){
  var toks = target.split(/\s+/), tw = [], map = [];
  toks.forEach(function(t){ var w = words(t); map.push([tw.length, tw.length+w.length]); tw = tw.concat(w); });
  var sw = words(spoken), m = lcs(tw, sw), hit = m.filter(Boolean).length;
  var ok = toks.map(function(t,i){
    var a=map[i][0], b=map[i][1];
    for(var k=a;k<b;k++) if(!m[k]) return false;
    return true;
  });
  return {score: tw.length ? hit/tw.length : 0, toks:toks, ok:ok};
}

/* ───────── 음성 인식 · 읽어주기 · 효과음 ───────── */
var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
var REC = null;
function say(text){
  try{
    if(!window.speechSynthesis) return;
    speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(text); u.lang='en-US'; u.rate=0.9;
    speechSynthesis.speak(u);
  }catch(e){}
}
function stopAll(){
  try{ if(REC){ REC.onend=null; REC.abort(); } }catch(e){}
  REC = null;
  try{ if(window.speechSynthesis) speechSynthesis.cancel(); }catch(e){}
}
var AC;
function beep(ok){
  try{
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    var t = AC.currentTime;
    (ok ? [[660,0],[880,.12]] : [[220,0],[160,.14]]).forEach(function(p){
      var o = AC.createOscillator(), g = AC.createGain();
      o.type='sine'; o.frequency.value=p[0];
      g.gain.setValueAtTime(.15, t+p[1]); g.gain.exponentialRampToValueAtTime(.001, t+p[1]+.2);
      o.connect(g); g.connect(AC.destination); o.start(t+p[1]); o.stop(t+p[1]+.22);
    });
  }catch(e){}
}

function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }

  };

function startLesson(l){
  L = {l:l, queue:l.cards.map(function(c){ var o={}; for(var k in c) o[k]=c[k]; o.tries=0; return o; }),
       total:l.cards.length, hearts:5, solved:0, first:0, xp:0};
  showCard();
}

function showCard(){
  var c = L.queue[0];
  if(!c){ return finish(); }
  S = {phase:'idle', text:'', typed:!SR, checked:false, pass:false, res:null, reveal:(!save.hide && c.type!=='full'), err:''};
  var head = '<div class="lh"><button class="x" id="quit" aria-label="나가기">✕</button><div class="bar"><i style="width:'+(L.solved/L.total*100)+'%"></i></div><div class="hearts">❤️ <span id="hc">'+L.hearts+'</span></div></div>';
  var body = '<main class="card">';
  body += '<div class="prompt">'+(c.q ? '질문에 답해 보세요' : c.type==='full' ? '전체 답변을 말해 보세요' : (save.hide ? '영어로 말해 보세요' : '소리 내어 말해 보세요'))+'</div>';
  if(L.l.question) body += '<div class="topicq">'+esc(L.l.question)+'</div>';
  if(c.q) body += '<div class="bubble"><button class="spk" id="qspk" aria-label="질문 듣기">🔊</button><span>'+esc(c.q)+'</span></div>';
  if(c.label) body += '<span class="chip">'+esc(c.label)+'</span>';
  body += '<div class="ko">'+esc(c.ko)+'</div><div class="en" id="en"></div><div id="mic"></div></main><footer class="foot" id="foot"></footer>';
  app.innerHTML = head + body;
  window.scrollTo(0,0);
  document.getElementById('quit').onclick = function(){ ask('레슨을 그만둘까요?<br>진행 상황은 저장되지 않아요.', '그만두기', home); };
  if(c.q){ document.getElementById('qspk').onclick = function(){ say(c.q); }; say(c.q); }
  renderEn(); renderMic(); renderFoot();
}

function renderEn(){
  var c = L.queue[0], el = document.getElementById('en');
  if(S.checked){
    var h = '<div class="row"><button class="spk" id="espk" aria-label="듣기">🔊</button><div>';
    h += S.res.toks.map(function(t,i){ return '<span class="'+(S.res.ok[i]?'w-ok':'w-no')+'">'+esc(t)+'</span>'; }).join(' ');
    h += '</div></div>';
    el.innerHTML = h;
    document.getElementById('espk').onclick = function(){ say(c.en); };
  } else if(S.reveal){
    el.innerHTML = '<div class="row"><button class="spk" id="espk" aria-label="듣기">🔊</button><div>'+esc(c.en)+'</div></div>';
    document.getElementById('espk').onclick = function(){ say(c.en); };
  } else {
    el.innerHTML = '<button class="hint" id="rev">💡 '+(c.type==='full'?'모범 답안 보기':'영어 힌트 보기')+'</button>';
    document.getElementById('rev').onclick = function(){ S.reveal = true; renderEn(); };
  }
}

function renderMic(){
  var c = L.queue[0], el = document.getElementById('mic'), full = c.type==='full', h = '';
  if(S.checked){
    h = '<div class="say"><small>내가 말한 문장</small>'+(S.text ? esc(S.text) : '(말하지 않았어요)')+'</div>';
  } else if(S.typed){
    h = '<div class="mic"><textarea class="say" id="ti" rows="'+(full?5:2)+'" placeholder="영어로 입력하세요" autocapitalize="off" spellcheck="false">'+esc(S.text)+'</textarea>'
      + (SR ? '<button class="link" id="tomic">🎤 마이크로 말하기</button>' : '') + '</div>';
  } else if(S.phase === 'listening'){
    h = '<div class="mic"><button class="micbtn on" id="mb" aria-label="말하기 끝내기">■</button><div class="micmsg">'+(full?'다 말한 뒤 ■를 눌러 주세요':'듣고 있어요… 말해 보세요')+'</div>'
      + '<div class="say" id="live"><small>인식 중</small><span id="livet">'+esc(S.text)+'</span></div></div>';
  } else {
    var msg = S.err ? '<div class="errmsg">'+S.err+'</div>' : '<div class="micmsg">'+(S.phase==='ready' ? '다시 말하려면 마이크를 누르세요' : '마이크를 누르고 말해 보세요')+'</div>';
    h = '<div class="mic"><button class="micbtn" id="mb" aria-label="말하기 시작">🎤</button>'+msg
      + (S.phase==='ready' ? '<div class="say"><small>내가 말한 문장</small>'+esc(S.text)+'</div>' : '')
      + '<button class="link" id="totype">⌨️ 키보드로 입력</button></div>';
  }
  el.innerHTML = h;
  var mb = document.getElementById('mb');
  if(mb) mb.onclick = function(){ S.phase==='listening' ? stopListen() : startListen(); };
  var tt = document.getElementById('totype'); if(tt) tt.onclick = function(){ S.typed = true; S.err=''; renderMic(); };
  var tm = document.getElementById('tomic'); if(tm) tm.onclick = function(){ S.typed = false; renderMic(); renderFoot(); };
  var ti = document.getElementById('ti');
  if(ti) ti.oninput = function(){ S.text = ti.value; S.phase = S.text.trim() ? 'ready' : 'idle'; renderFoot(); };
}

function renderFoot(){
  var el = document.getElementById('foot'), c = L.queue[0], h;
  if(S.checked){
    var pct = Math.round(S.res.score*100);
    h = '<div class="in"><div class="fb">'+(S.pass ? ['잘했어요!','완벽해요!','좋아요!','훌륭해요!'][Math.floor(Math.random()*4)]+' ('+pct+'%)'
        : '아쉬워요 ('+pct+'%)<small>빨간 단어를 다시 확인해 보세요. 정답은 위에 표시돼요.</small>')+'</div>'
      + '<button class="btn'+(S.pass?'':' red')+'" id="next">계속하기</button></div>';
    el.className = 'foot ' + (S.pass ? 'ok' : 'bad');
  } else {
    var can = S.phase==='ready' && S.text.trim().length>0;
    h = '<div class="in"><button class="btn" id="chk"'+(can?'':' disabled')+'>확인하기</button>'
      + '<button class="skip" id="skp">건너뛰기</button></div>';
    el.className = 'foot';
  }
  el.innerHTML = h;
  var chk = document.getElementById('chk'); if(chk) chk.onclick = check;
  var skp = document.getElementById('skp'); if(skp) skp.onclick = function(){ stopAll(); S.text=''; check(); };
  var nx = document.getElementById('next'); if(nx) nx.onclick = next;
}

function startListen(){
  var c = L.queue[0], full = c.type==='full';
  stopAll();
  var r = new SR(); REC = r;
  r.lang = 'en-US'; r.interimResults = true; r.continuous = full; r.maxAlternatives = 1;
  var fin = '';
  S.phase = 'listening'; S.text = ''; S.err = '';
  renderMic(); renderFoot();
  r.onresult = function(e){
    var interim = '';
    for(var i=e.resultIndex;i<e.results.length;i++){
      var t = e.results[i][0].transcript;
      if(e.results[i].isFinal) fin += t + ' '; else interim += t;
    }
    S.text = (fin + interim).trim();
    var lt = document.getElementById('livet'); if(lt) lt.textContent = S.text;
  };
  r.onerror = function(e){
    var m = {
      'not-allowed':'마이크 권한이 필요해요. 주소창의 자물쇠 아이콘에서 마이크를 허용해 주세요.',
      'service-not-allowed':'마이크 권한이 필요해요. 주소창의 자물쇠 아이콘에서 마이크를 허용해 주세요.',
      'no-speech':'소리가 들리지 않았어요. 마이크를 누르고 다시 말해 보세요.',
      'audio-capture':'마이크를 찾을 수 없어요. 마이크 연결을 확인해 주세요.',
      'network':'음성 인식에 인터넷 연결이 필요해요.'
    };
    S.err = m[e.error] || '';
  };
  r.onend = function(){
    REC = null; S.text = S.text.trim();
    S.phase = S.text ? 'ready' : 'idle';
    if(!S.text && !S.err) S.err = '소리가 들리지 않았어요. 마이크를 누르고 다시 말해 보세요.';
    renderMic(); renderFoot();
  };
  try{ r.start(); }catch(e){ S.phase='idle'; renderMic(); }
}
function stopListen(){
  var r = REC; if(!r) return;
  r.onresult = r.onerror = r.onend = null;   /* 늦게 도착하는 이벤트는 무시 */
  REC = null;
  try{ r.stop(); }catch(e){}
  setTimeout(function(){ try{ r.abort(); }catch(e){} }, 300);   /* stop이 안 먹는 브라우저 대비 */
  S.text = S.text.trim();
  S.phase = S.text ? 'ready' : 'idle';
  S.err = S.text ? '' : '소리가 들리지 않았어요. 마이크를 누르고 다시 말해 보세요.';
  renderMic(); renderFoot();
}

function check(){
  stopAll();
  var c = L.queue[0], full = c.type==='full';
  S.res = evaluate(c.en, S.text);
  S.pass = S.res.score >= (full ? 0.5 : 0.7);
  S.checked = true;
  if(!S.pass){ L.hearts = Math.max(0, L.hearts-1); var hc = document.getElementById('hc'); if(hc) hc.textContent = L.hearts; }
  beep(S.pass);
  renderEn(); renderMic(); renderFoot();
}

function next(){
  var c = L.queue.shift();
  if(S.pass){
    L.solved++; if(c.tries===0) L.first++;
    L.xp += c.tries===0 ? 10 : 5;
  } else {
    c.tries++;
    if(L.hearts<=0) return failed();
    L.queue.push(c);
  }
  showCard();
}

function failed(){
  stopAll();
  app.innerHTML = '<div class="res"><div class="big">💔</div><h1>하트를 모두 썼어요</h1><p>괜찮아요. 한 번 더 도전해 보세요!</p>'
    + '<div style="margin-top:30px;display:grid;gap:12px;justify-items:center"><button class="btn" id="again">다시 도전</button><button class="btn ghost" id="out">나가기</button></div></div>';
  var l = L.l;
  document.getElementById('again').onclick = function(){ startLesson(l); };
  document.getElementById('out').onclick = home;
}

function finish(){
  stopAll();
  var acc = Math.round(L.first / L.total * 100), stars = acc>=90 ? 3 : acc>=70 ? 2 : 1;
  save.done[L.l.id] = Math.max(save.done[L.l.id]||0, stars);
  save.xp += L.xp;
  var t = today();
  if(save.last !== t){ save.streak = (save.last === yesterday()) ? save.streak+1 : 1; save.last = t; }
  persist();
  app.innerHTML = '<div class="res"><div class="big">🎉</div><h1>레슨 완료!</h1><div class="stars">'+'★'.repeat(stars)+'<span style="opacity:.25">'+'★'.repeat(3-stars)+'</span></div>'
    + '<div class="tiles"><div class="tile"><div class="h" style="background:var(--yellow)">획득 XP</div><div class="b">⚡ '+L.xp+'</div></div>'
    + '<div class="tile"><div class="h" style="background:var(--green)">첫 시도 정확도</div><div class="b">🎯 '+acc+'%</div></div></div>'
    + '<button class="btn" id="done">계속하기</button></div>';
  document.getElementById('done').onclick = home;
}

home();
})();
</script>
</body>
</html>
